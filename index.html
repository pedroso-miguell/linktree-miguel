<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./img/m.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Linktree | Miguel Lara Pedroso</title>

  
</head>

<body>

  <div class="rings">
  <span></span>
  <span></span>
</div>


  <!-- Fundo Parallax -->
  <div class="parallax-bg">
    <div class="layer layer1"></div>
    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
  </div>


  <!-- Luz que segue o mouse -->
  <div id="light-effect" class="cursor-light dark"></div>

  <!-- Header -->
  <header>
    <img src="./img/miguel.png" alt="Foto de perfil" />
    <p>Miguel Lara Pedroso</p>

    <!-- Botão de tema -->
    <div id="switch" onclick="toggleMode()">
      <button></button>
      <span></span>
    </div>
  </header>

  <main>
    <section class="links">
      <a class="link" target="_blank" href="https://www.linkedin.com/in/miguel-lara-004670241/">
        <ion-icon name="logo-linkedin"></ion-icon>
        <span>LinkedIn</span>
      </a>

      <a class="link" target="_blank" href="https://github.com/pedroso-miguell">
        <ion-icon name="logo-github"></ion-icon>
        <span>Github</span>
      </a>

      <a class="link" target="_blank" href="https://porfolio-miguellarapedroso.netlify.app">
        <ion-icon name="globe-outline"></ion-icon>
        <span>Portifólio</span>
      </a>

      <a class="link" target="_blank" href="https://www.instagram.com/_miguellaraa/">
        <ion-icon name="logo-instagram"></ion-icon>
        <span>Instagram</span>
      </a>
    </section>
  </main>

  <!-- ICONS -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- JS -->
  <script src="main.js"></script>
</body>

</html>
